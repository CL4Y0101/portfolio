name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly rebuild (Mon 03:00 UTC / 10:00 WIB) so the contribution
    # skyline re-syncs even when nothing was pushed that week.
    - cron: "0 3 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        run: npm ci

      # Refresh the contribution snapshot before building so every deploy
      # (push, manual, or the weekly scheduled run) ships current data.
      # A failed scrape never blocks a deploy: the committed JSON is used.
      - name: Sync contribution data
        run: npm run contributions:sync
        continue-on-error: true

      - name: Validate
        run: |
          npm run lint
          npm run typecheck

      - name: Build static site
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_BASE_PATH: ${{ vars.NEXT_BASE_PATH }}

      # On scheduled/manual runs, commit the refreshed snapshot back so the
      # copy in the repo stays current too, not just the deployed site.
      - name: Commit refreshed contribution data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet -- data/contributions.json; then
            echo "Contribution data already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json
          git commit -m "chore: sync GitHub contribution data"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
